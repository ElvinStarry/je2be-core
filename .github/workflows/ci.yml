name: New CI

on:
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: '?'
        required: true
        default: main
        type: string
      windows:
        description: W
        required: true
        default: true
        type: boolean
      linux:
        description: L
        required: true
        default: true
        type: boolean
      macos:
        description: M
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Restore source timestamps
        shell: bash
        run: bash tool/git-restore-mtime.sh

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: new-ci-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-ci-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            new-ci-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: je2be-windows-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/Release/*.exe
            build/Release/*.dll
            build/Release/je2be.lib
            include/

  linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Restore source timestamps
        shell: bash
        run: bash tool/git-restore-mtime.sh

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: new-ci-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-ci-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            new-ci-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: je2be-linux-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/j2b
            build/b2j
            build/x2j
            build/p2j
            build/dump
            build/j2j-uuid
            build/j2b2j
            build/je2be-test
            build/libje2be.a
            include/

  macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Restore source timestamps
        shell: bash
        run: bash tool/git-restore-mtime.sh

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: new-ci-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            new-ci-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}-
            new-ci-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: je2be-macos-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/j2b
            build/b2j
            build/x2j
            build/p2j
            build/dump
            build/j2j-uuid
            build/j2b2j
            build/je2be-test
            build/libje2be.a
            include/
